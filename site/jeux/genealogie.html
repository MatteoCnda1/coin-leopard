<style>
  :root { --parch: #f1e2c4; --parch-ink: #3a2a1e; --parch-line: #c9ad80; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --parch: #e6d3ae; --parch-ink: #2b1e14; --parch-line: #b8996a; } }
  :root[data-theme="dark"] { --parch: #e6d3ae; --parch-ink: #2b1e14; --parch-line: #b8996a; }

  .steps { display: flex; gap: 8px; flex-wrap: wrap; }
  .step {
    border: 2.5px solid var(--edge); border-radius: 999px; background: var(--paper); padding: 6px 14px; font-weight: 800;
    cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: .92rem;
  }
  .step[aria-current="step"] { background: var(--rose); color: var(--on-rose); box-shadow: 3px 3px 0 var(--edge); }
  .step:disabled { opacity: .45; cursor: not-allowed; }
  .step .n { font-variant-numeric: tabular-nums; }

  .chapter { display: grid; gap: 22px; }
  .ch-head { display: grid; gap: 8px; }
  .ch-head .eyebrow { font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; color: var(--rose); }
  .ch-head h2 { font-size: clamp(1.8rem, 5vw, 2.6rem); }
  .ch-head p { max-width: 68ch; }

  /* Pièces d'archives */
  .docs { display: grid; gap: 12px; min-width: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { border: 2px solid var(--edge); background: var(--paper-2); border-radius: 10px; padding: 5px 12px; font-weight: 700; cursor: pointer; font-size: .88rem; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .paper {
    background: var(--parch); color: var(--parch-ink); border: 1px solid var(--parch-line); border-radius: 6px;
    padding: 22px clamp(14px, 3vw, 28px); font-family: var(--f-old); font-size: 1.08rem; line-height: 1.6;
    box-shadow: inset 0 0 60px rgba(120, 80, 30, .25), 4px 4px 0 var(--edge); position: relative; min-width: 0;
  }
  .paper .src { font-family: var(--f-body); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; opacity: .7; margin-bottom: 12px; }
  .paper .act { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 18px; }
  .paper .marg { border-right: 1px solid var(--parch-line); padding-right: 12px; font-size: .95rem; }
  .paper .marg b { font-variant: small-caps; font-size: 1.1rem; }
  .paper .mention { font-style: italic; font-size: .9rem; margin-top: 10px; }
  .paper .latin { font-style: italic; }
  .paper .tr { font-family: var(--f-body); font-size: .8rem; opacity: .75; margin-top: 12px; }
  .paper table { border-collapse: collapse; width: 100%; font-size: .98rem; }
  .paper th, .paper td { border: 1px solid var(--parch-line); padding: 5px 8px; text-align: left; }
  .paper th { font-family: var(--f-body); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  .table-scroll { overflow-x: auto; }
  @media (max-width: 560px) { .paper .act { grid-template-columns: minmax(0, 1fr); } .paper .marg { border-right: 0; border-bottom: 1px solid var(--parch-line); padding: 0 0 10px; } }

  /* Médaillon */
  .case { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: center; }
  .medal {
    width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 35% 30%, #fbfbf7, #c9c6bd 55%, #8d8a83);
    border: 3px solid #6f6c66; box-shadow: 0 0 0 7px #b9b6ad, 6px 8px 0 7px var(--edge); color: #4a4741;
    font-family: var(--f-old); font-style: italic; font-size: 1.35rem; line-height: 1.2; transform: rotate(-6deg);
  }
  .medal small { display: block; font-size: 1rem; letter-spacing: .06em; }
  @media (max-width: 600px) { .case { grid-template-columns: minmax(0, 1fr); justify-items: center; } }

  /* Questions */
  .qs { display: grid; gap: 16px; }
  .q { display: grid; gap: 10px; padding: 16px; border-radius: 16px; background: var(--paper-2); }
  .q .qt { font-weight: 800; }
  .q .qt .num { color: var(--rose); margin-right: 6px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 8px; }
  .opt {
    text-align: left; border: 2px solid var(--edge); border-radius: 12px; background: var(--paper); padding: 9px 12px;
    cursor: pointer; font-weight: 600; transition: transform .08s;
  }
  .opt:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--edge); }
  .opt.sel { background: var(--blush); }
  .opt.good { background: var(--ok); color: var(--paper); border-color: var(--ok); }
  .opt.bad { background: var(--bad); color: var(--paper); border-color: var(--bad); animation: shake .3s; }
  .opt:disabled { cursor: default; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .explain { border-left: 4px solid var(--rose); padding-left: 12px; font-size: .95rem; }
  .numrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .numrow input { width: 8em; border: 2px solid var(--edge); border-radius: 12px; padding: 8px 12px; background: var(--paper); font-weight: 800; }

  /* Arbre */
  .two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .tree { display: grid; gap: 14px; }
  .gen { display: grid; gap: 6px; }
  .gen-label { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--cocoa); }
  .gen-row { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; }
  .slot { display: grid; gap: 4px; padding: 8px; border-radius: 12px; border: 2px solid var(--edge); background: var(--paper); min-width: 0; }
  .slot label { font-size: .75rem; font-weight: 800; color: var(--rose); font-variant-numeric: tabular-nums; }
  .slot select { width: 100%; border: 1.5px solid var(--taupe); border-radius: 8px; padding: 4px; background: var(--paper-2); font-size: .85rem; min-width: 0; }
  .slot.fixed { background: var(--blush); }
  .slot.fixed span { font-weight: 800; font-size: .9rem; }
  .slot.good { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
  .slot.bad { border-color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
  @media (max-width: 520px) { .gen-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .rule { font-size: .92rem; background: var(--paper-2); border-radius: 12px; padding: 10px 14px; }

  .facts { display: grid; gap: 8px; }
  .facts .opt { font-family: var(--f-old); font-size: 1.05rem; }

  .nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* Diplôme */
  .diploma-frame { background: var(--sand) url("../assets/img/leopard.jpg") center / 140% auto; padding: 18px; border-radius: 20px; border: 2.5px solid var(--edge); box-shadow: var(--shadow); }
  .diploma {
    background: var(--parch); color: var(--parch-ink); border-radius: 10px; padding: clamp(18px, 5vw, 44px);
    text-align: center; display: grid; gap: 12px; justify-items: center; font-family: var(--f-old);
  }
  .diploma .k { font-family: var(--f-body); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: .78rem; }
  .diploma h2 { font-family: var(--f-display); font-size: clamp(1.9rem, 6vw, 3rem); color: #c4486a; }
  .diploma .who { font-family: var(--f-hand); font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1; }
  .diploma .mention { font-style: italic; font-size: 1.25rem; }
  .diploma .sig { display: flex; justify-content: space-between; width: 100%; max-width: 520px; gap: 16px; flex-wrap: wrap; font-size: .95rem; }
  .diploma .sig .hand { font-family: var(--f-hand); font-size: 1.6rem; }
  .lineage { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; font-weight: 700; }
  .lineage span { background: var(--paper-2); border-radius: 999px; padding: 4px 12px; border: 2px solid var(--edge); }
  .lineage i { font-style: normal; color: var(--rose); }
</style>
</head>

            "L'ignorer complètement", "Garder la date la plus récente quand deux sources se contredisent"], a: 1,
        x: "Un arbre en ligne est une piste, pas une preuve. Chaque information doit renvoyer à une source primaire." },
    ],
  },
  {
    key: "loin", short: "Remonter le temps", title: "La Révolution et le latin", eyebrow: "Étape 5 · archives anciennes",
    intro: `Les Archives t'envoient deux actes plus anciens de la lignée MARTIN : la naissance de Pierre, le père de Jean,
      sous le calendrier républicain, puis un baptême du registre paroissial, rédigé en latin.`,
    docs: ["an8", "bapteme"],
    questions: [
      { id: "l1", q: "À quelle date grégorienne correspond le 18 brumaire an VIII ?", o: ["18 novembre 1799", "9 novembre 1799", "9 octobre 1800", "18 octobre 1798"], a: 1,
        x: "C'est le jour du coup d'État de Bonaparte. Brumaire, « le mois des brumes », est le 2ᵉ mois de l'année républicaine, à cheval sur octobre et novembre." },
      { id: "l2", q: "D'après l'acte, Pierre MARTIN est donc né le…", o: ["9 novembre 1799", "8 novembre 1799", "17 novembre 1799", "10 novembre 1799"], a: 1,
        x: "« Né hier » : la date de l'acte n'est pas toujours celle de la naissance. Un grand classique." },
      { id: "l3", q: "Antoine MARTIN, premier témoin, est « aïeul de l'enfant ». Pour Pierre, c'est…", o: ["son oncle", "son parrain", "son grand-père", "son arrière-grand-père"], a: 2,
        x: "Aïeul = grand-parent. Bisaïeul = arrière-grand-parent, trisaïeul = arrière-arrière." },
      { id: "l4", q: "Pierre est le n° 84. Quel est le numéro Sosa de son père, Joseph ?", o: ["85", "126", "168", "169"], a: 2,
        x: "2 × 84 = 168. Catherine BLANC est le n° 169." },
      { id: "l5", q: "« Millesimo septingentesimo septuagesimo primo » : en quelle année ?", o: ["1717", "1701", "1771", "1777"], a: 2,
        x: "1000 + 700 + 70 + 1 = 1771." },
      { id: "l6", q: "Joseph est baptisé le 15 mars 1771. Il est né le…", o: ["15 mars 1771", "14 mars 1771", "1er mars 1771", "15 mai 1771"], a: 1,
        x: "Natus heri : né la veille. Les enfants étaient baptisés très vite, souvent le jour même ou le lendemain." },
      { id: "l7", q: "« Qui signare nescierunt » signifie…", o: ["qui ont refusé de signer", "qui n'ont pas su signer", "qui étaient absents", "qui ont signé"], a: 1,
        x: "La formule revient sans cesse : beaucoup de parrains et marraines ne savaient pas écrire." },
      { id: "l8", q: "La marraine, Joanna MARTIN, est dite « amita ». C'est…", o: ["la tante paternelle", "la tante maternelle", "la grand-mère", "la sage-femme"], a: 0,
        x: "Amita = sœur du père, donc d'Antoine MARTIN. Matertera = sœur de la mère. Avunculus, c'est l'oncle maternel : Joseph FABRE est bien le frère d'Anne." },
      { id: "l9", q: "Et le numéro Sosa d'Antoine MARTIN, le père de Joseph ?", o: ["168", "336", "337", "672"], a: 1,
        x: "2 × 168 = 336. Anne FABRE porte le 337. Tu viens de remonter neuf générations." },
    ],
  },
  {
    key: "verdict", short: "Le verdict", title: "Le verdict", eyebrow: "Étape 6 · le rapport",
    intro: `Le médaillon est gravé <b>« J. M. — 24.IV.1852 »</b>. Plusieurs personnes aux initiales J. M. sont passées dans ton enquête. À toi de conclure.`,
    medal: true,
    questions: [
      { id: "v1", q: "À qui appartenait le médaillon ?",
        o: ["Joseph MARTIN, baptisé en 1771", "Joanna MARTIN, marraine en 1771", "Jean MARTIN, marié le 24 avril 1852", "Jean-Baptiste ROLLAND, témoin en l'an VIII"], a: 2,
        x: "24.IV.1852, c'est le jour de son mariage avec Adèle ROUX. Les deux autres J. M. sont morts bien avant 1852, et ROLLAND n'a pas les bonnes initiales." },
      { id: "v2", type: "num", q: "Quel est le numéro Sosa de Jean MARTIN dans l'arbre d'Hélène ?", a: 42,
        x: "1 Hélène → 2 Marc → 5 Lucienne → 10 Émile → 21 Rose → 42 Jean." },
      { id: "v3", q: "Pour Hélène, Jean MARTIN est son…", o: ["bisaïeul", "trisaïeul", "quadrisaïeul", "aïeul"], a: 2,
        x: "Le n° 42 est dans la 6ᵉ génération (32 à 63) : arrière-arrière-arrière-grand-père, soit quadrisaïeul." },
      { id: "v4", q: "Par quel chemin le médaillon est-il probablement arrivé chez Lucienne ?",
        o: ["Jean → sa fille Rose → son fils Émile → sa fille Lucienne", "Jean → Pierre → Joseph → Lucienne",
            "Adèle → Marguerite VIDAL → Lucienne", "Hélène l'a acheté dans une brocante"], a: 0,
        x: "Jean vivait chez Rose en 1896 : c'est sans doute elle qui l'a gardé, puis transmis à son fils Émile, le père de Lucienne." },
    ],
  },
];

/* ------------------------------------------------------------------ état */
const fresh = () => ({ ch: 0, max: 0, pts: {}, ok: {}, tried: {}, tree: {} });
let S = Object.assign(fresh(), store.get("genea", {}));
const save = () => store.set("genea", S);

const MAX = CHAPTERS.reduce((s, c) => s + c.questions.reduce((t, q) => t + (q.pts || 1), 0), 0) + Object.keys(TREE_ANS).length;
const total = () => Object.values(S.pts).reduce((a, b) => a + b, 0);
function chapterDone(c) {
  const ch = CHAPTERS[c];
  return ch.questions.every(q => S.ok[q.id]) && (!ch.tree || S.ok.tree);
}

/* ------------------------------------------------------------------ rendu */
const $ch = document.getElementById("chapter");

function renderSteps() {
  document.getElementById("steps").innerHTML = CHAPTERS.map((c, i) =>
    `<button class="step" data-i="${i}" ${i > S.max ? "disabled" : ""} ${i === S.ch ? 'aria-current="step"' : ""}>
       <span class="n">${chapterDone(i) && i < S.max ? "✓" : i + 1}</span>${c.short}</button>`).join("");
  document.getElementById("pts").textContent = total();
  document.getElementById("max").textContent = MAX;
}
document.getElementById("steps").addEventListener("click", e => {
  const b = e.target.closest(".step"); if (!b || b.disabled) return;
  S.ch = +b.dataset.i; save(); render();
});

function medalHTML() {
  return `<div class="medal" aria-label="Médaillon gravé J. M., 24 avril 1852"><div>J. M.<small>24 · IV · 1852</small></div></div>`;
}

function docsHTML(ids) {
  return `<div class="docs"><div class="tabs" role="tablist">${ids.map((id, i) =>
      `<button class="tab" role="tab" data-doc="${id}" aria-selected="${i === 0}">${DOCS[id].tab}</button>`).join("")}</div>
    <article class="paper" data-paper>${DOCS[ids[0]].html}</article></div>`;
}

function render() {
  const ch = CHAPTERS[S.ch];
  let html = `<div class="ch-head"><span class="eyebrow">${ch.eyebrow}</span><h2>${ch.title}</h2></div>`;
  if (ch.medal) html += `<div class="case">${medalHTML()}<p>${ch.intro}</p></div>`;
  else html += `<p style="max-width:68ch">${ch.intro}</p>`;

  if (ch.tree) {
    html += `<div class="two">${docsHTML(ch.docs)}<div class="tree" id="tree">${treeHTML()}</div></div>`;
  } else if (ch.docs) {
    html += docsHTML(ch.docs);
  }
  if (ch.questions.length) html += `<div class="qs">${ch.questions.map((q, i) => qHTML(q, i)).join("")}</div>`;

  if (S.ch === 0) {
    html += `<p>Ta méthode : réviser les bases, dépouiller les actes, vérifier ce qu'on trouve en ligne, remonter jusqu'à l'Ancien Régime, puis rendre ton rapport.
      Chaque bonne réponse du premier coup rapporte un point. À la fin, le jury te remet ton diplôme.</p>`;
  }
  const last = S.ch === CHAPTERS.length - 1;
  html += `<div class="nav">
      <button class="btn ghost" data-nav="-1" ${S.ch === 0 ? "hidden" : ""}>← Étape précédente</button>
      <span class="hand" style="font-family:var(--f-hand);font-size:1.3rem;color:var(--cocoa)" id="hint"></span>
      <button class="btn" data-nav="1" ${chapterDone(S.ch) ? "" : "disabled"}>${S.ch === 0 ? "Accepter la mission" : last ? "Rendre mon rapport" : "Étape suivante →"}</button>
    </div>`;
  if (last && S.done) html += diplomaHTML();
  $ch.innerHTML = html;
  hint();
  renderSteps();
}

function hint() {
  const el = document.getElementById("hint"); if (!el) return;
  const ch = CHAPTERS[S.ch];
  const left = ch.questions.filter(q => !S.ok[q.id]).length + (ch.tree && !S.ok.tree ? 1 : 0);
  el.textContent = left ? `Encore ${left} ${left > 1 ? "énigmes" : "énigme"} à résoudre` : "";
}

function qHTML(q, i) {
  const ok = S.ok[q.id];
  let body = "";
  if (q.type === "num") {
    body = `<div class="numrow"><input id="in-${q.id}" inputmode="numeric" aria-label="Numéro Sosa" value="${ok ? q.a : ""}" ${ok ? "disabled" : ""}>
      <button class="btn" data-num="${q.id}" ${ok ? "disabled" : ""}>Valider</button></div>`;
  } else {
    const multi = q.type === "multi";
    body = `<div class="${multi ? "facts" : "opts"}">${q.o.map((o, j) => {
      const isGood = multi ? q.a.includes(j) : q.a === j;
      return `<button class="opt ${ok && isGood ? "good" : ""}" data-q="${q.id}" data-j="${j}" ${ok ? "disabled" : ""}>${o}</button>`;
    }).join("")}</div>`;
    if (multi && !ok) body += `<div><button class="btn" data-multi="${q.id}">Valider ma sélection</button></div>`;
  }
  return `<div class="q" id="q-${q.id}"><div class="qt"><span class="num">${i + 1}.</span>${q.q}</div>${body}
    ${ok ? `<div class="explain">${q.x}</div>` : ""}</div>`;
}

function findQ(id) { for (const c of CHAPTERS) for (const q of c.questions) if (q.id === id) return q; }

function solve(q, correct) {
  if (correct) {
    S.ok[q.id] = true;
    S.pts[q.id] = S.tried[q.id] ? 0 : (q.pts || 1);
    save();
    const idx = CHAPTERS[S.ch].questions.indexOf(q);
    document.getElementById("q-" + q.id).outerHTML = qHTML(q, idx);
    document.querySelector("[data-nav='1']").disabled = !chapterDone(S.ch);
    hint(); renderSteps();
    if (chapterDone(S.ch)) toast("Étape terminée !");
  } else {
    S.tried[q.id] = true; save();
  }
}

$ch.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest(".tab");
  if (tab) {
    const box = tab.closest(".docs");
    box.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === tab));
    box.querySelector("[data-paper]").innerHTML = DOCS[tab.dataset.doc].html;
    return;
  }
  const opt = t.closest(".opt");
  if (opt && !opt.disabled) {
    const q = findQ(opt.dataset.q), j = +opt.dataset.j;
    if (q.type === "multi") { opt.classList.toggle("sel"); return; }
    if (j === q.a) solve(q, true);
    else { opt.classList.remove("bad"); void opt.offsetWidth; opt.classList.add("bad"); opt.disabled = true; solve(q, false); }
    return;
  }
  if (t.dataset.multi) {
    const q = findQ(t.dataset.multi);
    const sel = [...document.querySelectorAll(`[data-q="${q.id}"].sel`)].map(b => +b.dataset.j).sort();
    if (sel.join() === [...q.a].sort().join()) solve(q, true);
    else { solve(q, false); toast(sel.length !== q.a.length ? `Il faut choisir exactement ${q.a.length} informations.` : "Pas tout à fait. Relis les actes."); }
    return;
  }
  if (t.dataset.num) {
    const q = findQ(t.dataset.num);
    const v = parseInt(document.getElementById("in-" + q.id).value, 10);
    if (v === q.a) solve(q, true);
    else { solve(q, false); toast("Ce n'est pas ce numéro. Remonte la lignée : père = 2n, mère = 2n + 1."); }
    return;
  }
  if (t.id === "check-tree") return checkTree();
  if (t.dataset.nav) {
    const d = +t.dataset.nav;
    if (d > 0 && S.ch === CHAPTERS.length - 1) { finish(); return; }
    S.ch = Math.max(0, Math.min(CHAPTERS.length - 1, S.ch + d));
    S.max = Math.max(S.max, S.ch);
    save(); render(); scrollTo({ top: 0, behavior: "smooth" });
  }
});
$ch.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id && e.target.id.startsWith("in-")) document.querySelector(`[data-num="${e.target.id.slice(3)}"]`).click();
});

/* ------------------------------------------------------------------ arbre */
function treeHTML() {
  const done = S.ok.tree;
  const gens = TREE.map(g => {
    const entries = Object.entries(g.slots || g.fixed);
    return `<div class="gen"><div class="gen-label">${g.label}</div><div class="gen-row" style="--n:${entries.length}">${entries.map(([n, name]) => {
      if (g.fixed) return `<div class="slot fixed"><label>Sosa ${n}</label><span>${name}</span></div>`;
      const cur = S.tree[n] || "";
      return `<div class="slot ${done ? "good" : ""}" id="slot-${n}"><label for="sel-${n}">Sosa ${n}</label>
        <select id="sel-${n}" data-sosa="${n}" ${done ? "disabled" : ""}><option value="">…</option>
        ${NAMES.map(x => `<option ${x === cur ? "selected" : ""}>${x}</option>`).join("")}</select></div>`;
    }).join("")}</div></div>`;
  }).join("");
  return `${gens}<div class="rule">Rappel : père de <i>n</i> = 2<i>n</i>, mère de <i>n</i> = 2<i>n</i> + 1. Lucienne (5) a donc pour parents 10 et 11.</div>
    ${done ? `<div class="explain">Bravo, la branche est complète et sourcée. Tu as même repéré que Rose était recensée sous son nom de naissance.</div>`
           : `<div><button class="btn" id="check-tree">Vérifier mon arbre</button></div>`}`;
}

$ch.addEventListener("change", e => {
  if (e.target.dataset.sosa) {
    S.tree[e.target.dataset.sosa] = e.target.value; save();
    e.target.closest(".slot").classList.remove("good", "bad");
  }
});

function checkTree() {
  let right = 0;
  const n = Object.keys(TREE_ANS).length;
  for (const [sosa, name] of Object.entries(TREE_ANS)) {
    const good = S.tree[sosa] === name;
    if (good) right++;
    const slot = document.getElementById("slot-" + sosa);
    slot.classList.remove("good", "bad"); slot.classList.add(good ? "good" : "bad");
  }
  if (S.pts.tree === undefined) { S.pts.tree = right; }
  if (right === n) {
    S.ok.tree = true; save();
    document.getElementById("tree").innerHTML = treeHTML();
    document.querySelector("[data-nav='1']").disabled = !chapterDone(S.ch);
    hint(); toast(`Arbre complet ! ${S.pts.tree} / ${n} du premier coup.`);
  } else {
    save(); toast(`${right} / ${n} bien placés. Les cases rouges sont à revoir.`);
  }
  renderSteps();
}

/* ------------------------------------------------------------------ fin */
function mention(p) {
  if (p >= .9) return "Très bien, avec les félicitations du jury";
  if (p >= .75) return "Bien";
  if (p >= .5) return "Assez bien";
  return "Passable, mais le jury t'adore quand même";
}

function diplomaHTML() {
  const p = total() / MAX;
  const date = new Date(S.done).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  return `<div class="lineage" aria-label="Transmission du médaillon">
      <span>42 · Jean</span><i>→</i><span>21 · Rose</span><i>→</i><span>10 · Émile</span><i>→</i><span>5 · Lucienne</span><i>→</i><span>2 · Marc</span><i>→</i><span>1 · Hélène</span>
    </div>
    <div class="diploma-frame"><div class="diploma">
      <span class="k">Le jury du Coin Léopard certifie que</span>
      <div class="who">${CONFIG.prenom}</div>
      <span>a résolu l'Affaire du médaillon et obtient le</span>
      <h2>Diplôme de Généalogiste</h2>
      <span class="mention">mention ${mention(p)}</span>
      <span>${total()} points sur ${MAX}</span>
      <div class="sig"><span>Fait à Vienne, le ${date}</span><span class="hand">${CONFIG.signature}</span></div>
    </div></div>`;
}

function finish() {
  if (!S.done) { S.done = Date.now(); save(); }
  award("genealogie");
  confetti();
  render();
  setTimeout(() => document.querySelector(".diploma-frame").scrollIntoView({ behavior: "smooth", block: "center" }), 100);
}

document.getElementById("reset").addEventListener("click", e => {
  const b = e.currentTarget;
  if (b.dataset.confirm) { S = fresh(); save(); delete b.dataset.confirm; b.textContent = "Rouvrir le dossier à zéro"; render(); return; }
  b.dataset.confirm = "1"; b.textContent = "Sûre ? Clique encore";
  setTimeout(() => { delete b.dataset.confirm; b.textContent = "Rouvrir le dossier à zéro"; }, 3000);
});

render();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku du léopard</title>
<!--HEAD-->
<meta name="theme-color" content="#c8ae8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coin Léopard">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/style.css">
<!--/HEAD-->
<style>
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 22px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .sdk {
    display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); width: 100%; max-width: 560px; margin: 0 auto;
    border: 3px solid var(--edge); border-radius: 12px; overflow: hidden; background: var(--paper);
  }
  .c {
    aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border: 0; padding: 0; background: var(--paper);
    border-right: 1px solid var(--taupe); border-bottom: 1px solid var(--taupe); font-size: clamp(1.1rem, 4.6vw, 1.9rem);
    font-weight: 800; color: var(--rose); cursor: pointer; position: relative; font-variant-numeric: tabular-nums;
  }
  .c:nth-child(9n) { border-right: 0; }
  .c:nth-child(9n+3), .c:nth-child(9n+6) { border-right: 3px solid var(--edge); }
  .c.r3, .c.r6 { border-bottom: 3px solid var(--edge); }
  .c.r9 { border-bottom: 0; }
  .c.given { color: var(--ink); cursor: default; }
  .c.zone { background: var(--paper-2); }
  .c.same { background: var(--blush); }
  .c.sel { background: var(--blush); box-shadow: inset 0 0 0 3px var(--rose); }
  .c.err { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--paper)); }
  .notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: clamp(.45rem, 1.5vw, .7rem); color: var(--cocoa); font-weight: 700; }
  .notes span { display: grid; place-items: center; }
  .pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .pad button {
    aspect-ratio: 1; max-width: 100%; border: 2.5px solid var(--edge); border-radius: 14px; background: var(--paper);
    font-size: 1.5rem; font-weight: 800; cursor: pointer; box-shadow: 2px 2px 0 var(--edge); position: relative;
  }
  .pad button small { position: absolute; bottom: 2px; right: 6px; font-size: .62rem; color: var(--cocoa); }
  .pad button.done { opacity: .35; }
  .pad .wide { aspect-ratio: auto; font-size: .95rem; padding: 10px 4px; }
  .pad .on { background: var(--rose); color: var(--on-rose); }
  .side { display: grid; gap: 14px; }
  .levels { display: flex; gap: 8px; flex-wrap: wrap; }
  .levels .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <a class="back" href="../index.html">← Le repaire</a>
    <div class="stats">
      <span class="pill">Erreurs : <b id="errs">0</b></span>
      <span class="pill">Temps : <b id="time">0:00</b></span>
    </div>
  </div>

  <section class="sticker game-head">
    <h1>Sudoku du léopard</h1>
    <p class="hand">Touche une case puis un chiffre. Chaque ligne, colonne et carré contient 1 à 9 une seule fois.</p>
    <div class="levels" role="group" aria-label="Difficulté">
      <button class="btn ghost" data-lvl="facile">Facile</button>
      <button class="btn ghost" data-lvl="moyen">Moyen</button>
      <button class="btn ghost" data-lvl="difficile">Difficile</button>
    </div>
  </section>

  <section class="layout board-zone">
    <div class="sticker"><div class="sdk" id="sdk" aria-label="Grille de sudoku"></div></div>
    <div class="sticker side">
      <div class="pad" id="pad"></div>
      <p style="font-size:.92rem;color:var(--cocoa)">Le crayon permet de noter des petites pistes. Ta partie est sauvegardée automatiquement.</p>
    </div>
  </section>
</main>
<script src="../assets/js/common.js"></script>
<script>
  const LEVELS = { facile: 40, moyen: 32, difficile: 26 };
  const sdk = document.getElementById("sdk"), pad = document.getElementById("pad");
  let G, sel = -1, notesMode = false, timer;

  const row = i => (i / 9) | 0, col = i => i % 9, box = i => ((row(i) / 3) | 0) * 3 + ((col(i) / 3) | 0);
  const PEERS = Array.from({ length: 81 }, (_, i) => {
    const s = new Set();
    for (let j = 0; j < 81; j++) if (j !== i && (row(j) === row(i) || col(j) === col(i) || box(j) === box(i))) s.add(j);
    return [...s];
  });

  // Solveur : compte les solutions (jusqu'à limit), remplit g en place si fill
  function solve(g, limit = 2, fill = false, rnd = false) {
    let count = 0;
    const rec = () => {
      let best = -1, bestOpts = null;
      for (let i = 0; i < 81; i++) if (!g[i]) {
        const used = new Set(PEERS[i].map(j => g[j]));
        const opts = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(d => !used.has(d));
        if (!opts.length) return false;
        if (!bestOpts || opts.length < bestOpts.length) { best = i; bestOpts = opts; if (opts.length === 1) break; }
      }
      if (best < 0) { count++; return count >= limit; }
      for (const d of rnd ? shuffle(bestOpts) : bestOpts) {
        g[best] = d;
        if (rec()) { if (!fill) g[best] = 0; return true; }
      }
      g[best] = 0;
      return false;
    };
    rec();
    return count;
  }

  function generate(level) {
    const sol = Array(81).fill(0);
    solve(sol, 1, true, true);
    const puz = [...sol];
    let givens = 81;
    for (const i of shuffle([...Array(81).keys()])) {
      if (givens <= LEVELS[level]) break;
      const keep = puz[i]; puz[i] = 0;
      if (solve([...puz], 2) !== 1) puz[i] = keep; else givens--;
    }
    return { level, sol, puz, val: [...puz], notes: Array.from({ length: 81 }, () => []), errs: 0, secs: 0, done: false };
  }

  function newGame(level) {
    G = generate(level); sel = -1; save(); render(); startTimer();
  }
  const save = () => store.set("sudoku:game", G);

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => { if (!G.done && !document.hidden) { G.secs++; if (G.secs % 5 === 0) save(); showTime(); } }, 1000);
  }
  const showTime = () => document.getElementById("time").textContent = `${Math.floor(G.secs / 60)}:${String(G.secs % 60).padStart(2, "0")}`;

  function render() {
    const sv = sel >= 0 ? G.val[sel] : 0;
    sdk.innerHTML = G.val.map((v, i) => {
      const cls = ["c", "r" + (row(i) + 1)];
      if (G.puz[i]) cls.push("given");
      if (sel >= 0 && i !== sel && PEERS[sel].includes(i)) cls.push("zone");
      if (sv && v === sv && i !== sel) cls.push("same");
      if (i === sel) cls.push("sel");
      if (v && !G.puz[i] && v !== G.sol[i]) cls.push("err");
      const inner = v ? v : G.notes[i].length
        ? `<div class="notes">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<span>${G.notes[i].includes(d) ? d : ""}</span>`).join("")}</div>` : "";
      return `<button class="${cls.join(" ")}" data-i="${i}" aria-label="Ligne ${row(i) + 1} colonne ${col(i) + 1}${v ? ", " + v : ", vide"}">${inner}</button>`;
    }).join("");
    const counts = Array(10).fill(0);
    G.val.forEach((v, i) => { if (v && v === G.sol[i]) counts[v]++; });
    pad.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-d="${d}" class="${counts[d] === 9 ? "done" : ""}">${d}<small>${9 - counts[d]}</small></button>`).join("")
      + `<button data-d="0" aria-label="Effacer">⌫</button>`
      + `<button class="wide ${notesMode ? "on" : ""}" data-notes style="grid-column: span 2">✏️ Crayon ${notesMode ? "activé" : ""}</button>`
      + `<button class="wide" data-new style="grid-column: span 3">Nouvelle grille</button>`;
    document.getElementById("errs").textContent = G.errs;
    document.querySelectorAll("[data-lvl]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lvl === G.level));
    showTime();
  }

  function put(d) {
    if (sel < 0 || G.puz[sel] || G.done) return;
    if (d === 0) { G.val[sel] = 0; G.notes[sel] = []; }
    else if (notesMode) {
      if (G.val[sel]) return;
      const n = G.notes[sel];
      G.notes[sel] = n.includes(d) ? n.filter(x => x !== d) : [...n, d];
    } else {
      G.val[sel] = d;
      if (d !== G.sol[sel]) { G.errs++; }
      else PEERS[sel].forEach(j => { G.notes[j] = G.notes[j].filter(x => x !== d); });
    }
    save(); render();
    if (G.val.every((v, i) => v === G.sol[i])) win();
  }

  function win() {
    G.done = true; save(); clearInterval(timer);
    award("sudoku"); confetti();
    const r = best("sudoku:" + G.level, G.secs, false);
    setTimeout(() => showEnd({
      title: "Grille terminée !",
      text: `Niveau ${G.level}, en ${Math.floor(G.secs / 60)} min ${G.secs % 60} s avec ${G.errs} erreur${G.errs > 1 ? "s" : ""}.${r.isNew ? "<br><b>Nouveau record !</b>" : ""}`,
      againLabel: "Nouvelle grille", again: () => newGame(G.level),
    }), 500);
  }

  sdk.addEventListener("click", e => { const c = e.target.closest(".c"); if (!c) return; sel = +c.dataset.i; render(); });
  pad.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.d !== undefined) put(+b.dataset.d);
    else if (b.hasAttribute("data-notes")) { notesMode = !notesMode; render(); }
    else if (b.hasAttribute("data-new")) newGame(G.level);
  });
  document.querySelectorAll("[data-lvl]").forEach(b => b.addEventListener("click", () => newGame(b.dataset.lvl)));
  addEventListener("keydown", e => {
    if (/^[1-9]$/.test(e.key)) put(+e.key);
    else if (e.key === "Backspace" || e.key === "Delete") put(0);
    else if (sel >= 0 && e.key.startsWith("Arrow")) {
      e.preventDefault();
      const m = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -9, ArrowDown: 9 }[e.key];
      sel = (sel + m + 81) % 81; render();
    }
  });

  const saved = store.get("sudoku:game", null);
  if (saved && !saved.done) { G = saved; render(); startTimer(); }
  else newGame(saved ? saved.level : "facile");
</script>
</body>
</html>
